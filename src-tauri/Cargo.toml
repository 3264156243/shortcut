[package]
name = "shortcut-tauri"
version = "2.4.6"
description = "ShortCut - Desktop quick panel for shortcuts (Tauri 2)"
authors = ["wanan"]
license = ""
repository = ""
edition = "2024"
rust-version = "1.90"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# tauri build 鎵撳寘鏃惰嚜鍔ㄥ惎鐢紱鐩存帴 cargo build --release 椤绘樉寮忓甫涓婏紝
# 鍚﹀垯绐楀彛浼氬幓杩?devUrl锛坙ocalhost:5173锛夎€屼笉鏄祵鍏ョ殑 dist 璧勬簮
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2.7.0", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
sha2 = "0.10"
regex = "1"
base64 = "0.22"
tauri-plugin-dialog = "2"
rand = "0.9"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "process", "sync", "time", "macros"] }
tokio-stream = "0.1"
futures-util = "0.3"
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
ureq = { version = "2", default-features = false, features = ["json", "tls"] }
tauri = { version = "2.12.0", features = ["tray-icon", "image-ico"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-updater = "2"
tauri-plugin-log = "2"
tauri-plugin-single-instance = "2"
# ── 转换板块（纯 Rust 本地转换，计划见 docs/文件转换板块开发计划.md）──
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "tiff", "webp", "ico"] }
zip = { version = "2.2", default-features = false, features = ["deflate", "aes-crypto"] }
tar = "0.4"
flate2 = "1"
bzip2 = "0.4"
xz2 = "0.1"
zstd = "0.13"
walkdir = "2"
encoding_rs = "0.8"
ico = "0.3"
# ── 音频转换（P2：symphonia 解码 + mp3/flac/opus/wav 编码）──
symphonia = { version = "0.5", default-features = false, features = ["wav", "mp3", "flac", "ogg", "isomp4", "pcm", "vorbis", "aac"] }
mp3lame-encoder = "0.2"
flacenc = "0.4.0"  # 0.5 fork 有 STREAMINFO 序列化 bug（symphonia 无法解码），锁定原版
opus = "0.3"
ogg = "0.9"
rubato = "0.16"
# ── 资源管理器右键菜单（P3，仅 Windows）──
[target.'cfg(windows)'.dependencies]
winreg = "0.55"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
