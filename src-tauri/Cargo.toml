[package]
name = "shortcut-tauri"
version = "2.4.5"
description = "ShortCut - Desktop quick panel for shortcuts (Tauri 2)"
authors = ["wanan"]
license = ""
repository = ""
edition = "2024"
rust-version = "1.90"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.0" }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.0", features = ["tray-icon", "image-ico"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
tauri-plugin-log = "2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
