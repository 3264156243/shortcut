<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />

  <script>
  /* 明暗模式：在样式生效前应用，避免刷新闪烁 */
  (function () {
    try {
      var m = localStorage.getItem('sc-mode');
      if (m !== 'light' && m !== 'dark') m = 'dark';
      document.documentElement.setAttribute('data-mode', m);
    } catch (e) {
      document.documentElement.setAttribute('data-mode', 'dark');
    }
  })();
  </script>
<link rel="stylesheet" href="/assets/css/site.css" />
<link rel="stylesheet" href="/assets/css/pages.css" />
</head>

<body data-page="changelog">

<div id="site-nav"></div>

<main>

  <section class="page-head">
    <div class="wrap">
        <nav class="crumbs" aria-label="面包屑"><a href="/">首页</a><span>/</span><span>更新日志</span></nav>
      <h1>更新日志</h1>
      <p>最新版本信息从更新清单实时读取，历史版本记录在站点数据里维护。</p>
    </div>
  </section>

  <!-- 最新版本 + 版本总览 -->
  <section class="section section--flush">
    <div class="wrap">
      <div class="latest-release reveal" id="latestRelease">
        <div class="latest-release__head">
          <span class="badge"><span class="dot-live"></span>最新版本</span>
          <h2 id="latestVersion">读取中…</h2>
          <span class="tag" id="latestDate">—</span>
          <span class="tag" id="latestSize">—</span>
        </div>
        <ul id="latestNotes"></ul>
        <div class="btn-row" style="margin-top:20px">
          <a class="btn btn--primary btn--sm" id="latestDownload" href="/download.html">下载此版本</a>
          <button class="btn btn--sm" id="expandAll" type="button">展开全部版本</button>
        </div>
      </div>

      <!-- 版本索引（快速跳转） -->
      <nav class="version-index reveal" id="versionIndex" aria-label="版本索引"></nav>
    </div>
  </section>

  <!-- 完整时间轴 -->
  <section class="section section--tight">
    <div class="wrap">
      <div class="section-head reveal">
        <span class="eyebrow">完整历史</span>
        <h2>所有版本，点开看详情</h2>
        <p id="timelineStats">—</p>
      </div>
      <div class="timeline" id="timeline"><!-- 由 changelog.js 渲染 --></div>
    </div>
  </section>


  <!-- 结尾 CTA -->
  <section class="cta">
    <div class="wrap">
      <h2>试试 <span class="grad">ShortCut</span></h2>
      <p>Windows 10 / 11 · 免费下载 · 无需登录</p>
      <div class="btn-row center">
        <a class="btn btn--primary btn--lg" href="/download.html">下载最新版本</a>
        <a class="btn btn--ghost btn--lg" href="/faq.html">先看看常见问题</a>
      </div>
    </div>
  </section>

</main>

<div id="site-footer"></div>
