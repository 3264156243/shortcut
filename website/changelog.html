<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>更新日志 — ShortCut 版本变更记录</title>
<meta name="description" content="ShortCut 的版本更新记录：每个版本修复了什么、新增了什么。最新版本信息实时读取更新清单。" />
<meta name="theme-color" content="#f3eee4" />

<meta property="og:type" content="website" />
<meta property="og:site_name" content="ShortCut" />
<meta property="og:title" content="更新日志 — ShortCut 版本变更记录" />
<meta property="og:description" content="ShortCut 的版本更新记录：每个版本修复了什么、新增了什么。最新版本信息实时读取更新清单。" />
<meta property="og:image" content="/assets/img/og.png" />
<meta name="twitter:card" content="summary_large_image" />

<link rel="icon" href="/assets/img/favicon.ico" sizes="any" />
<link rel="icon" type="image/png" href="/assets/img/logo-64.png" sizes="64x64" />
<link rel="apple-touch-icon" href="/assets/img/apple-touch-icon.png" />

  <script>
  /* 明暗模式：在样式生效前应用，避免刷新闪烁 */
  (function () {
    try {
      var m = localStorage.getItem('sc-mode');
      if (m !== 'light' && m !== 'dark') m = 'light';
      document.documentElement.setAttribute('data-mode', m);
    } catch (e) {
      document.documentElement.setAttribute('data-mode', 'light');
    }
  })();
  </script>
<link rel="stylesheet" href="/assets/css/site.css" />
<link rel="stylesheet" href="/assets/css/pages.css" />
<link rel="stylesheet" href="/assets/css/product-v3.css" />
<link rel="stylesheet" href="/assets/css/workbench.css" />
</head>

<body data-page="changelog">

<div id="site-nav"></div>

<main>

  <section class="page-head">
    <div class="wrap">
        <nav class="crumbs" aria-label="面包屑"><a href="/">首页</a><span>/</span><span>更新日志</span></nav>
      <h1>更新日志</h1>
      <p>从最新版本到最早版本，按版本、类型或关键词快速找到一次变化。</p>
    </div>
  </section>

  <section class="workbench-page workbench-page--release" aria-labelledby="releaseHistoryTitle">
    <div class="wrap">
      <div class="release-console reveal">
        <div class="release-console__lead">
          <span class="release-console__flag"><i></i>最新发布</span>
          <div class="release-console__version">
            <span>当前版本</span>
            <strong id="latestVersion">读取中…</strong>
          </div>
          <div class="release-console__meta">
            <span id="latestDate">—</span>
            <span id="latestSize">—</span>
          </div>
          <p>每次发布都按用户能感知的变化整理。下载前可以先看清这个版本新增、优化和修复了什么。</p>
          <div class="release-console__actions">
            <a class="btn btn--primary" id="latestDownload" href="/download.html">下载此版本</a>
            <a class="btn btn--ghost" href="/faq.html">安装与更新说明</a>
          </div>
        </div>
        <div class="release-console__notes">
          <div class="release-console__notes-head">
            <span>本次更新</span>
            <span class="release-live"><i></i>实时读取</span>
          </div>
          <ul id="latestNotes">
            <li>正在读取最新版本信息…</li>
          </ul>
        </div>
      </div>

      <div class="release-command reveal">
        <div class="release-command__title">
          <span class="eyebrow">版本档案</span>
          <h2 id="releaseHistoryTitle">找到你需要的那次变化</h2>
          <p>按版本号或关键词搜索，也可以只看新增、优化和修复。</p>
        </div>
        <div class="release-command__tools">
          <label class="release-search" for="releaseSearch">
            <span data-icon="search" aria-hidden="true"></span>
            <input id="releaseSearch" type="search" placeholder="搜索版本、功能或问题…" autocomplete="off" />
            <kbd>/</kbd>
          </label>
          <div class="release-filters" id="releaseFilters" aria-label="按更新类型筛选">
            <button class="release-filter is-active" type="button" data-release-filter="all">全部 <b data-filter-count="all">0</b></button>
            <button class="release-filter" type="button" data-release-filter="new">新增 <b data-filter-count="new">0</b></button>
            <button class="release-filter" type="button" data-release-filter="improve">优化 <b data-filter-count="improve">0</b></button>
            <button class="release-filter" type="button" data-release-filter="fix">修复 <b data-filter-count="fix">0</b></button>
          </div>
        </div>
      </div>

      <div class="release-layout">
        <aside class="release-rail reveal" aria-label="版本概览">
          <div class="release-digest">
            <div><strong id="releaseVersionCount">—</strong><span>个版本</span></div>
            <div><strong id="releaseChangeCount">—</strong><span>条变化</span></div>
          </div>
          <div class="release-rail__head">
            <span>快速定位</span>
            <button class="release-expand" id="expandAll" type="button">展开全部</button>
          </div>
          <nav class="release-jump" id="versionIndex" aria-label="版本索引"></nav>
          <a class="release-rail__help" href="/faq.html">
            <span data-icon="shield" aria-hidden="true"></span>
            <span><b>更新遇到问题？</b><small>查看安装、覆盖升级与版本兼容说明</small></span>
          </a>
        </aside>

        <section class="release-feed-wrap reveal" aria-live="polite">
          <div class="release-feed-head">
            <div>
              <span class="release-feed-head__label">Release notes</span>
              <h3>版本记录</h3>
            </div>
            <p id="releaseResultCount">正在整理版本记录…</p>
          </div>
          <div class="release-feed" id="timeline"></div>
          <div class="release-empty" id="releaseEmpty" hidden>
            <span data-icon="search" aria-hidden="true"></span>
            <h3>没有找到匹配的更新</h3>
            <p>换一个关键词，或切回“全部”查看完整记录。</p>
            <button class="btn btn--sm" id="releaseReset" type="button">清除筛选</button>
          </div>
        </section>
      </div>
    </div>
  </section>




</main>

<div id="site-footer"></div>

  <script src="/assets/js/data.js"></script>
  <script src="/assets/js/site.js"></script>
  <script src="/assets/js/motion.js"></script>
  <script src="/assets/js/changelog-data.js"></script>
  <script src="/assets/js/changelog.js"></script>
  <script>
  (function () {
    'use strict';
    Array.prototype.forEach.call(document.querySelectorAll('[data-icon]'), function (n) {
      n.innerHTML = SC.icon(n.getAttribute('data-icon'), 20);
    });
  })();
  </script>
</body>
</html>
