<body data-page="feedback" class="page-feedback"><a class="skip-link" href="#main">跳到正文</a><div id="site-nav"></div><main id="main"><header class="utility-head wrap"><div class="eyebrow"><i></i>问题反馈</div><h1>你的体验，<br>是下一次改进的起点。</h1><p>告诉我们哪里不顺手。公开留言、处理状态和管理员回复，都能在这里查看。</p></header><section class="wrap community-layout"><section class="feedback-history" aria-labelledby="feedbackHistoryTitle"><div class="feedback-history__head"><div class="community-title"><h2 id="feedbackHistoryTitle">公开留言</h2><span id="feedbackListStatus" role="status">正在读取…</span></div><div class="feedback-history__controls"><label class="feedback-history__search" for="fbSearch"><span data-icon="search" aria-hidden="true"></span><input type="search" id="fbSearch" placeholder="搜索留言与回复" autocomplete="off"></label><div class="feedback-filter-row"><select id="fbStatusFilter" aria-label="按状态筛选"><option value="all">全部状态</option><option value="pending">待处理</option><option value="confirmed">已确认</option><option value="processing">处理中</option><option value="needs_info">需要补充</option><option value="resolved">已解决</option><option value="closed">已关闭</option></select><select id="fbTypeFilter" aria-label="按类型筛选"><option value="all">全部类型</option><option value="bug">问题故障</option><option value="feature">功能建议</option><option value="ui">界面体验</option><option value="update">安装更新</option><option value="other">其他</option></select><select id="fbSort" aria-label="排序"><option value="latest">最新发布</option><option value="replied">最新回复</option></select></div></div></div><div id="fbList" class="feedback-message-list"></div></section><aside class="compose-aside"><div class="feedback-compose__head"><div class="eyebrow">LET’S MAKE IT BETTER</div><h2>说说你的想法。</h2><p>匿名发布，无需注册。请先搜索是否已有相同问题。</p></div><form id="fbForm" class="feedback-compose" novalidate><fieldset class="feedback-type-field"><legend>留言类型</legend><div class="feedback-type-row"><label><input type="radio" name="fbType" value="bug" checked><span>问题故障</span></label><label><input type="radio" name="fbType" value="feature" ><span>功能建议</span></label><label><input type="radio" name="fbType" value="ui" ><span>界面体验</span></label><label><input type="radio" name="fbType" value="update" ><span>安装更新</span></label><label><input type="radio" name="fbType" value="other" ><span>其他</span></label></div></fieldset><div class="feedback-field-grid"><label class="feedback-field feedback-field--wide" for="fbTitle"><span>一句话标题 <small>*</small></span><input id="fbTitle" name="title" required maxlength="120" placeholder="发生了什么，或你希望改进什么"></label><label class="feedback-field" for="fbArea"><span>相关板块</span><select id="fbArea" name="area"><option value="">不确定 / 其他</option><option value="快捷方式">快捷方式</option><option value="任务墙">任务墙</option><option value="SC球">SC球</option><option value="翻译">翻译</option><option value="驾驶舱">驾驶舱</option><option value="应用使用记录">应用使用记录</option><option value="文件快传与手机联动">文件快传与手机联动</option><option value="安装与更新">安装与更新</option></select></label><label class="feedback-field" for="fbVersion"><span>软件版本</span><input id="fbVersion" name="version" maxlength="40" placeholder="2.5.1"></label><label class="feedback-field feedback-field--wide" for="fbDetails"><span>详细说明 <small>*</small></span><textarea id="fbDetails" name="details" required maxlength="4000" rows="5" placeholder="可以写下操作步骤、预期结果和实际发生的情况。"></textarea></label><label class="feedback-field feedback-field--wide" for="fbContact"><span>联系方式 <small>选填，仅后台可见</small></span><input id="fbContact" name="contact" maxlength="120" placeholder="邮箱、QQ 或微信"></label></div><div class="feedback-hp" aria-hidden="true"><label for="fbHp">请留空</label><input id="fbHp" name="hp" tabindex="-1" autocomplete="off"></div><div class="feedback-submit-row"><p>正文和回复公开展示，请勿填写密码、激活码等私人信息。</p><button id="fbSubmit" type="submit" class="btn btn--primary btn--block">发布留言 ↗</button></div><div id="fbStatus" class="feedback-inline-status" role="status" aria-live="polite"></div></form><div class="board-policy"><span data-icon="shield" aria-
