  <script>
  /* 明暗模式：在样式生效前应用，避免刷新闪烁 */
  (function () {
    try {
      var m = localStorage.getItem('sc-mode');
      if (m !== 'light' && m !== 'dark') m = 'light';
      document.documentElement.setAttribute('data-mode', m);
    } catch (e) {
      document.documentElement.setAttribute('data-mode', 'light');
    }
  })();
  </script>
