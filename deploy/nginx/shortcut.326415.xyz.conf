server {
    listen 80;
    listen [::]:80;
    server_name shortcut.326415.xyz;

    location ^~ /.well-known/acme-challenge/ {
        root /www/wwwroot/ShortCut;
    }

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name shortcut.326415.xyz;

    root /www/wwwroot/ShortCut;
    index index.html;

    ssl_certificate /www/server/panel/vhost/cert/shortcut.326415.xyz/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/shortcut.326415.xyz/privkey.pem;

    location = /updates/latest.yml {
        default_type text/yaml;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        limit_except GET HEAD { deny all; }
    }

    location /updates/ {
        autoindex off;
        default_type application/octet-stream;
        add_header Accept-Ranges "bytes" always;
        add_header X-Content-Type-Options "nosniff" always;
        limit_except GET HEAD { deny all; }
    }

    location / {
        try_files $uri $uri/ =404;
    }

    access_log /www/wwwlogs/shortcut.326415.xyz.log;
    error_log /www/wwwlogs/shortcut.326415.xyz.error.log;
}