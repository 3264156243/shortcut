server {
    listen 80;
    listen [::]:80;
    server_name shortcut.326415.xyz <SERVER_IP>;

    root /www/wwwroot/ShortCut;
    index index.html;

    location = /api/translate {
        proxy_pass http://127.0.0.1:32642/translate;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
        client_max_body_size 32k;
    }

    location = /updates/latest.yml {
        default_type text/yaml;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        limit_except GET HEAD { deny all; }
    }

    location /updates/ {
        autoindex off;
        default_type application/octet-stream;
        add_header Accept-Ranges "bytes" always;
        add_header X-Content-Type-Options "nosniff" always;
        limit_except GET HEAD { deny all; }
    }

    location / {
        try_files $uri $uri/ =404;
    }

    access_log /www/wwwlogs/shortcut.326415.xyz.log;
    error_log /www/wwwlogs/shortcut.326415.xyz.error.log;
}