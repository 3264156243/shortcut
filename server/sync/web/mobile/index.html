<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#26231f" />
  <title>ShortCut 移动联动</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #26231f; color: #f6efe5; font-family: "Microsoft YaHei", "PingFang SC", sans-serif; }
    .box { text-align: center; padding: 30px 22px; }
    h1 { font-size: 20px; margin: 0 0 8px; }
    p { color: #aaa198; font-size: 13px; margin: 0 0 22px; }
    a.links { display: block; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading { width: 26px; height: 26px; margin: 0 auto 6px; border: 3px solid #444; border-top-color: #9f493a; border-radius: 50%; animation: spin .8s linear infinite; }
  </style>
</head>
<body>
  <div class="box">
    <div class="loading"></div>
    <p>正在跳转到绑定页面…</p>
  </div>
  <script>
    // 统一移动联动入口：绑定身份抽离到独立绑定页 /bind/
    // 保留 /mobile/?bind=xxx 扫码直链兼容
    (function () {
      var params = new URLSearchParams(location.search);
      var bind = params.get('bind') || '';
      var next = params.get('next') || '';
      var target = '/bind/';
      if (bind) target += '?bind=' + encodeURIComponent(bind);
      if (next) target += (bind ? '&' : '?') + 'next=' + encodeURIComponent(next);
      setTimeout(function () { location.replace(target); }, 120);
    })();
  </script>
</body>
</html>
