<!doctype html>
<html lang="zh-CN">
<head>
  <!-- anti-cache: mobile page updates must take effect immediately -->
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#24221f" />
  <title>ShortCut 移动联动</title>
  <style>
    :root { font-family: "Microsoft YaHei", "PingFang SC", sans-serif; color: #f6efe5; background: #24221f; }
    * { box-sizing: border-box; letter-spacing: 0; }
    body { margin: 0; min-height: 100dvh; background: linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.02) 1px,transparent 1px),#24221f; background-size: 24px 24px; }
    button { font: inherit; cursor: pointer; }
    .app { width: min(100%, 560px); min-height: 100dvh; margin: auto; padding: 20px 16px 36px; }
    h1 { font-size: 22px; margin: 6px 0 4px; }
    .sub { color: #aaa198; font-size: 13px; margin-bottom: 6px; }
    .bind-strip { display: flex; align-items: center; gap: 10px; margin: 16px 0 22px; padding: 13px 14px; border: 1px solid rgba(255,255,255,.09); border-radius: 12px; background: #2c2925; }
    .dot { width: 9px; height: 9px; border-radius: 50%; background: #8f877e; }
    .dot.ok { background: #63b582; box-shadow: 0 0 0 4px rgba(99,181,130,.12); }
    .bind-meta { min-width: 0; flex: 1; font-size: 12px; color: #aaa198; }
    .bind-meta b { display: block; color: #f6efe5; font-size: 13px; }
    .pill { padding: 5px 10px; border: 1px solid rgba(255,255,255,.14); border-radius: 999px; font-size: 11px; color: #c8beb3; }
    .nav-list { display: flex; flex-direction: column; gap: 12px; margin-top: 8px; }
    .nav-card { display: flex; align-items: center; gap: 14px; padding: 18px 16px; color: #f6efe5; text-decoration: none; border: 1px solid rgba(255,255,255,.09); border-radius: 12px; background: #33302c; transition: transform .12s ease, background .12s ease; }
    .nav-card:active { transform: scale(.98); background: #3a3631; }
    .nav-ico { width: 46px; height: 46px; border-radius: 11px; display: grid; place-items: center; font-size: 22px; background: #3f3b36; }
    .nav-card .txt { flex: 1; }
    .nav-card .txt b { display: block; font-size: 16px; }
    .nav-card .txt span { color: #aaa198; font-size: 12px; }
    .nav-card .arrow { color: #948b82; font-size: 20px; }
    .foot { margin-top: 22px; color: #6f6861; font-size: 10px; text-align: center; }
  </style>
</head>
<body>
  <div class="app">
    <h1>ShortCut 移动联动</h1>
    <p class="sub">在手机与桌面之间同步任务、文件与文本</p>

    <div id="bindStrip" class="bind-strip">
      <i id="bindDot" class="dot"></i>
      <div class="bind-meta"><b id="bindTitle">未绑定</b><span id="bindDetail">绑定桌面端后可用联动功能</span></div>
      <span id="bindPill" class="pill">去绑定</span>
    </div>

    <nav class="nav-list" id="navList">
      <!-- 静态兜底：module.list 取不到时就用这几张卡（服务端 modules.json 是权威清单） -->
      <a id="cardTaskwall" class="nav-card" href="/taskwall/">
        <span class="nav-ico">🗂️</span>
        <span class="txt"><b>任务墙</b><span>把任务从手机钉到桌面任务墙</span></span>
        <span class="arrow">›</span>
      </a>
      <a id="cardTransfer" class="nav-card" href="/transfer/">
        <span class="nav-ico">📤</span>
        <span class="txt"><b>文件共享</b><span>发送/领取文件与文本，共享给他人</span></span>
        <span class="arrow">›</span>
      </a>
      <a id="cardControl" class="nav-card" href="/control/">
        <span class="nav-ico">🖥️</span>
        <span class="txt"><b>电脑控制</b><span>手机向电脑打字、控制鼠标、粘贴板</span></span>
        <span class="arrow">›</span>
      </a>
    </nav>

    <p class="foot">ShortCut · 移动联动平台</p>
  </div>

  <!-- 共享 SDK：绑定/请求/模块渲染统一由它提供（协议版本在 sdk.js 里） -->
  <script src="/sync/web/sdk.js"></script>
  <script>
    const sdk = window.ShortCutMobile;
    const $ = (id) => document.getElementById(id);
    const auth = sdk.binding();
    const bound = sdk.isBound();

    if (bound) {
      $('bindDot').classList.add('ok');
      $('bindTitle').textContent = auth.deviceName || '已绑定';
      $('bindDetail').textContent = (auth.code ? '绑定码 ' + auth.code : auth.bindId);
      $('bindPill').textContent = '管理';
    } else {
      $('bindPill').textContent = '去绑定';
    }
    // 顶部绑定信息条是唯一的绑定入口：未绑定"去绑定"、已绑定"管理"，点击均跳 /bind/
    $('bindStrip').style.cursor = 'pointer';
    $('bindStrip').onclick = () => location.href = '/bind/';

    // 模块清单：服务端 modules.json 权威下发（新增板块只需服务端加一条，这里不用改）
    // 取不到时保留上面的静态兜底卡片。
    sdk.modules().then((data) => {
      if (!data || !data.success || !Array.isArray(data.modules) || !data.modules.length) return;
      sdk.renderModules($('navList'), data.modules);
    });
  </script>
</body>
</html>
