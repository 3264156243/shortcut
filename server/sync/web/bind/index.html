<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#26231f" />
  <title>ShortCut 设备绑定</title>
  <style>
    :root { color-scheme: dark; font-family: "Microsoft YaHei", "PingFang SC", sans-serif; background: #26231f; color: #f6efe5; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; min-height: 100dvh; background: linear-gradient(rgba(255,255,255,.022) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.018) 1px, transparent 1px), #26231f; background-size: 24px 24px; }
    button, input { font: inherit; } button { cursor: pointer; }
    .shell { width: min(100%, 520px); margin: 0 auto; padding: 26px 18px 44px; }
    .back { width: 100%; margin-bottom: 20px; display: flex; align-items: center; gap: 8px; padding: 9px 2px; border: 0; background: transparent; color: #c8beb3; font-size: 13px; }
    .card { padding: 24px 20px; border: 1px solid rgba(255,255,255,.09); border-radius: 10px; background: #33302c; box-shadow: 0 18px 50px rgba(0,0,0,.3); }
    .card h1 { margin: 0 0 6px; font-size: 20px; }
    .card > p { margin: 0 0 20px; color: #aaa198; font-size: 12px; line-height: 1.7; }
    .bound { display: none; }
    .bound.show { display: block; }
    .device-row { display: flex; align-items: center; gap: 12px; padding: 14px; border: 1px solid rgba(255,255,255,.08); border-radius: 9px; background: #2b2824; }
    .device-icon { width: 40px; height: 40px; border-radius: 9px; display: grid; place-items: center; background: #9f493a; font-size: 18px; }
    .device-meta { min-width: 0; flex: 1; }
    .device-meta b { display: block; font-size: 14px; }
    .device-meta span { color: #aaa198; font-size: 11px; word-break: break-all; }
    .bind-code-label { margin: 18px 0 6px; color: #aaa198; font-size: 11px; }
    .bind-code-box { display: flex; align-items: center; gap: 10px; }
    .bind-code { flex: 1; padding: 13px; text-align: center; font: 700 24px Consolas, monospace; letter-spacing: 5px; color: #f6efe5; background: #26231f; border: 1px solid rgba(255,255,255,.12); border-radius: 8px; }
    .qrcode-box { margin: 18px 0 0; display: flex; justify-content: center; }
    .qrcode-box canvas, .qrcode-box img { border-radius: 8px; background: #fff; padding: 8px; }
    .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 22px; }
    .primary, .secondary { min-height: 46px; border: 0; border-radius: 8px; padding: 0 14px; font-weight: 700; }
    .primary { color: #fff; background: #9f493a; }
    .secondary { color: #eee4da; background: #3a3631; border: 1px solid rgba(255,255,255,.12); }
    .danger { color: #e5a19a; background: #3a2b29; border: 1px solid rgba(229,161,154,.25); }
    /* 未绑定状态 */
    .unbound { display: none; }
    .unbound.show { display: block; }
    label { display: block; margin: 14px 0 6px; color: #aaa198; font-size: 11px; font-weight: 700; }
    input.code-input { width: 100%; height: 50px; text-align: center; font: 700 24px Consolas, monospace; letter-spacing: 5px; color: #f6efe5; background: #26231f; border: 1px solid rgba(255,255,255,.12); border-radius: 8px; outline: none; }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 18px; }
    .scan-overlay { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; padding: 18px; background: rgba(22,20,18,.8); backdrop-filter: blur(8px); }
    .scan-overlay.hidden { display: none; }
    .scan-panel { width: min(100%, 420px); padding: 18px; border: 1px solid rgba(255,255,255,.1); border-radius: 10px; background: #33302c; box-shadow: 0 24px 70px rgba(0,0,0,.4); }
    .scan-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
    .scan-head h2 { margin: 0; font-size: 17px; }
    .scan-close { width: 34px; height: 34px; border: 0; border-radius: 50%; color: #f6efe5; background: rgba(255,255,255,.1); font-size: 20px; }
    .scan-camera { position: relative; overflow: hidden; aspect-ratio: 1; border-radius: 8px; background: #171512; width: 100%; }
    .scan-camera video { width: 100%; height: 100%; object-fit: cover; }
    .scan-frame { position: absolute; inset: 17%; border: 2px solid rgba(255,244,221,.85); border-radius: 8px; box-shadow: 0 0 0 999px rgba(0,0,0,.2); pointer-events: none; }
    .scan-line { position: absolute; left: 20%; right: 20%; top: 20%; height: 2px; background: #d56f55; box-shadow: 0 0 10px rgba(213,111,85,.9); animation: scanMove 2.2s ease-in-out infinite alternate; }
    @keyframes scanMove { to { top: 79%; } }
    .scan-tip { min-height: 20px; margin-top: 12px; color: #c8beb3; font-size: 12px; text-align: center; }
    .scan-tip.error { color: #e5a19a; }
    .scan-tip.success { color: #8ac49f; }
    .scan-fallback { width: 100%; min-height: 42px; margin-top: 12px; border: 1px solid rgba(255,255,255,.14); border-radius: 8px; color: #f6efe5; background: #3a3631; font-weight: 700; }
    canvas.hidden { display: none; }
    .hidden-input { display: none; }
    .message { min-height: 18px; margin-top: 12px; text-align: center; font-size: 12px; color: #c8beb3; }
    .message.error { color: #e5a19a; }
    .message.success { color: #8ac49f; }
    @media (max-width: 400px) { .grid2 { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <main class="shell">
    <button id="backBtn" class="back" type="button">‹ 返回</button>

    <!-- 已绑定状态 -->
    <section id="boundView" class="card bound">
      <h1 id="boundTitle">当前绑定</h1>
      <p>此设备已连接你的桌面端，所有移动板块共用此绑定。</p>
      <div class="device-row">
        <div class="device-icon">📱</div>
        <div class="device-meta">
          <b id="boundDeviceName">我的手机</b>
          <span id="boundDeviceId">--</span>
        </div>
      </div>
      <div class="bind-code-label">6 位绑定码（桌面端「联动绑定」可查看）</div>
      <div class="bind-code-box">
        <span id="boundCode" class="bind-code">------</span>
      </div>
      <div class="qrcode-box" id="qrcodeBox"></div>
      <div class="actions">
        <button id="unbindButton" class="secondary danger" type="button">更换绑定</button>
        <button id="reuseButton" class="primary" type="button">继续使用功能</button>
      </div>
      <div id="boundMessage" class="message"></div>
    </section>

    <!-- 未绑定状态 -->
    <section id="unboundView" class="card unbound">
      <h1>连接你的桌面端</h1>
      <p>在 ShortCut 设置 →「联动绑定」查看 6 位绑定码，或直接扫描设置页二维码进入。</p>
      <label for="bindCode">6 位绑定码</label>
      <input id="bindCode" class="code-input" maxlength="6" autocomplete="one-time-code" inputmode="text" placeholder="ABC123" />
      <label for="deviceName">设备名称（可选）</label>
      <input id="deviceName" maxlength="30" style="width:100%;height:42px;padding:0 12px;color:#f6efe5;background:#26231f;border:1px solid rgba(255,255,255,.12);border-radius:8px;" value="我的手机" />
      <div class="grid2">
        <button id="bindButton" class="primary" type="button">绑定码连接</button>
        <button id="scanButton" class="secondary" type="button">扫码绑定</button>
      </div>
      <div id="bindMessage" class="message"></div>
    </section>
  </main>

  <div id="scanOverlay" class="scan-overlay hidden" role="dialog" aria-modal="true">
    <div class="scan-panel">
      <div class="scan-head">
        <h2>扫描桌面端二维码</h2>
        <button id="scanCloseButton" class="scan-close" type="button" aria-label="关闭">×</button>
      </div>
      <div class="scan-camera"><video id="scanVideo" playsinline muted></video><div class="scan-frame"></div><div class="scan-line"></div></div>
      <p id="scanMessage" class="scan-tip">将桌面端二维码放入框内</p>
      <button id="scanImageButton" class="scan-fallback" type="button">摄像头不可用时，从相册选二维码图片</button>
      <input id="scanImageInput" class="hidden-input" type="file" accept="image/*" />
      <canvas id="scanCanvas" class="hidden"></canvas>
    </div>
  </div>

  <script>
    const API = '/sync/api.php';
    const storageKey = 'shortcut-mobile-binding-v1';
    const el = (id) => document.getElementById(id);
    let mobileAuth = null;
    let scanStream = null, scanFrame = 0, scanBusy = false, jsQrLoading = null;

    try { mobileAuth = JSON.parse(localStorage.getItem(storageKey) || 'null'); } catch {}

    const $ = (id) => el(id);

    function render() {
      const bound = !!mobileAuth?.bindId && !!mobileAuth?.mobileToken;
      $('boundView').classList.toggle('show', bound);
      $('unboundView').classList.toggle('show', !bound);
      const params = new URLSearchParams(location.search);
      const next = params.get('next');
      if (bound) {
        $('boundDeviceName').textContent = mobileAuth.deviceName || '我的手机';
        $('boundDeviceId').textContent = mobileAuth.bindId || '--';
        $('boundCode').textContent = mobileAuth.code || '------';
        // 生成二维码（桌面绑定链接）
        const bindUrl = 'https://shortcut.326415.xyz/mobile/?bind=' + encodeURIComponent(mobileAuth.bindId);
        renderQR(bindUrl);
        $('reuseButton').onclick = () => { if (next) location.href = next; else location.href = '/mobile/'; };
      } else {
        const directBind = params.get('bind');
        if (directBind) $('bindCode').placeholder = '扫码身份已读取，点「绑定码连接」';
      }
    }

    function loadQrLib() {
      if (window.QRCode) return Promise.resolve();
      return new Promise((resolve, reject) => {
        const s = document.createElement('script');
        s.src = 'https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js';
        s.onload = resolve; s.onerror = () => reject(new Error('二维码组件加载失败'));
        document.head.appendChild(s);
      });
    }
    async function renderQR(text) {
      const box = $('qrcodeBox');
      box.innerHTML = '';
      try {
        await loadQrLib();
        const canvas = document.createElement('canvas');
        await window.QRCode.toCanvas(canvas, text, { width: 168, margin: 1 });
        box.appendChild(canvas);
      } catch { box.innerHTML = '<span style="color:#aaa198;font-size:11px">' + text + '</span>'; }
    }

    async function callApi(payload) {
      const c = new AbortController(), t = setTimeout(() => c.abort(), 12000);
      try {
        const r = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload), signal: c.signal });
        const d = await r.json().catch(() => null);
        if (!r.ok || !d) throw new Error('服务暂时不可用');
        return d;
      } catch (e) { if (e && e.name === 'AbortError') throw new Error('请求超时'); throw e; }
      finally { clearTimeout(t); }
    }
    function msg(id, text, error = false) { const e = $(id); e.textContent = text || ''; e.className = 'message' + (error ? ' error' : ' success'); }

    async function doBind() {
      const code = $('bindCode').value.trim().toUpperCase();
      const bindParam = new URLSearchParams(location.search).get('bind') || '';
      if (!bindParam && code.length !== 6) return msg('bindMessage', '请输入 6 位绑定码', true);
      $('bindButton').disabled = true;
      msg('bindMessage', '正在连接…');
      try {
        const d = await callApi({ action: 'mobile.bind', bindId: bindParam, code, deviceName: $('deviceName').value.trim() || '我的手机' });
        if (!d.success) throw new Error(d.message || '绑定失败');
        mobileAuth = { bindId: d.bindId, mobileToken: d.mobileToken, deviceName: d.deviceName, code: d.code };
        localStorage.setItem(storageKey, JSON.stringify(mobileAuth));
        history.replaceState(null, '', location.pathname);
        render();
        msg('bindMessage', '绑定成功');
      } catch (e) { msg('bindMessage', e.message || '绑定失败', true); }
      finally { $('bindButton').disabled = false; }
    }

    function clearBinding() {
      localStorage.removeItem(storageKey);
      mobileAuth = null;
      history.replaceState(null, '', location.pathname);
      render();
    }

    // ===== 扫码 =====
    function loadJsQrFallback() {
      if (window.jsQR) return Promise.resolve();
      if (jsQrLoading) return jsQrLoading;
      jsQrLoading = new Promise((resolve, reject) => {
        const s = document.createElement('script');
        s.src = 'https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js';
        s.onload = resolve; s.onerror = () => reject(new Error('浏览器不支持扫码，请用绑定码连接'));
        document.head.appendChild(s);
      });
      return jsQrLoading;
    }
    function stopScanner() {
      cancelAnimationFrame(scanFrame); scanFrame = 0; scanBusy = false;
      if (scanStream) scanStream.getTracks().forEach((t) => t.stop());
      scanStream = null;
      $('scanVideo').srcObject = null;
      $('scanOverlay').classList.add('hidden');
    }
    async function connectWithScannedValue(value) {
      const v = String(value || '').trim();
      if (!v) return false;
      let bind = '', code = '';
      try { const u = new URL(v, location.origin); bind = u.searchParams.get('bind') || ''; code = u.searchParams.get('code') || ''; } catch {}
      if (!code && /^[A-Z0-9]{6}$/i.test(v)) code = v.toUpperCase();
      if (bind) { const d = await callApi({ action: 'mobile.bind', bindId: bind, deviceName: $('deviceName').value || '我的手机' }); if (d.success) { mobileAuth = { bindId: d.bindId, mobileToken: d.mobileToken, deviceName: d.deviceName, code: d.code }; localStorage.setItem(storageKey, JSON.stringify(mobileAuth)); return true; } }
      if (code) { const d = await callApi({ action: 'mobile.bind', code, deviceName: $('deviceName').value || '我的手机' }); if (d.success) { mobileAuth = { bindId: d.bindId, mobileToken: d.mobileToken, deviceName: d.deviceName, code: d.code }; localStorage.setItem(storageKey, JSON.stringify(mobileAuth)); return true; } }
      return false;
    }
    async function scanLoop(detector) {
      if (!scanStream || scanBusy) return;
      const video = $('scanVideo');
      if (video.readyState >= 2) {
        scanBusy = true;
        try {
          let value = '';
          if (detector) { const results = await detector.detect(video); value = results[0]?.rawValue || ''; }
          else if (window.jsQR) { const cv = $('scanCanvas'), w = video.videoWidth, h = video.videoHeight; if (w && h) { cv.width = w; cv.height = h; const ctx = cv.getContext('2d', { willReadFrequently: true }); ctx.drawImage(video, 0, 0, w, h); const px = ctx.getImageData(0, 0, w, h); value = window.jsQR(px.data, w, h, { inversionAttempts: 'dontInvert' })?.data || ''; } }
          if (value) { $('scanMessage').textContent = '已识别，正在连接…'; if (await connectWithScannedValue(value)) { stopScanner(); render(); } else $('scanMessage').textContent = '未识别到有效二维码'; }
        } catch (e) { $('scanMessage').textContent = e?.message || '识别失败'; }
        finally { scanBusy = false; }
      }
      if (scanStream) scanFrame = requestAnimationFrame(() => void scanLoop(detector));
    }
    async function recognizeImageFromFile(file) {
      if (!file) { $('scanMessage').textContent = '未选择图片'; return; }
      $('scanMessage').textContent = '正在识别图片…';
      try {
        await loadJsQrFallback();
        const img = new Image();
        await new Promise((resolve, reject) => { img.onload = resolve; img.onerror = reject; img.src = URL.createObjectURL(file); });
        const cv = document.createElement('canvas');
        const scale = Math.min(1, 1600 / img.width);
        cv.width = Math.round(img.width * scale); cv.height = Math.round(img.height * scale);
        const ctx = cv.getContext('2d', { willReadFrequently: true });
        ctx.drawImage(img, 0, 0, cv.width, cv.height);
        const px = ctx.getImageData(0, 0, cv.width, cv.height);
        const value = window.jsQR(px.data, cv.width, cv.height, { inversionAttempts: 'both' })?.data || '';
        if (!value) { stopScanner(); $('scanMessage').textContent = '图片中未识别到二维码'; return; }
        $('scanMessage').textContent = '已识别，正在连接…';
        if (await connectWithScannedValue(value)) { stopScanner(); render(); }
        else { stopScanner(); $('scanMessage').textContent = '未识别到有效二维码'; }
      } catch (e) {
        stopScanner(); $('scanMessage').textContent = '图片识别失败：' + (e?.message || '未知错误');
      }
    }

    async function startScanner() {
      // 修复：优先 requirement，降级分辨率，隐藏问题；无 getUserMedia 时提示用图片/绑定码
      if (!navigator.mediaDevices || typeof navigator.mediaDevices.getUserMedia !== 'function') {
        return msg('bindMessage', '当前浏览器/系统无法调用摄像头，可点「从相册选二维码图片」，或用绑定码连接', true);
      }
      $('scanOverlay').classList.remove('hidden');
      $('scanMessage').textContent = '正在启动摄像头…';
      $('scanMessage').className = 'scan-tip';
      try {
        let detector = null;
        if ('BarcodeDetector' in window) {
          try { const formats = typeof BarcodeDetector.getSupportedFormats === 'function' ? await BarcodeDetector.getSupportedFormats() : ['qr_code']; if (formats.includes('qr_code')) detector = new BarcodeDetector({ formats: ['qr_code'] }); } catch { detector = null; }
        }
        if (!detector) await loadJsQrFallback();
        // 摄像头：最宽松约束优先，逐步加后置倾向；任一失败都不致命，给出可用的流即可
        const constraints = [
          { video: true, audio: false },
          { video: { facingMode: { ideal: 'environment' } }, audio: false },
        ];
        let stream = null;
        for (const con of constraints) {
          try { stream = await navigator.mediaDevices.getUserMedia(con); break; } catch {}
        }
        if (!stream) throw new Error('无法访问摄像头');
        scanStream = stream;
        $('scanVideo').srcObject = stream;
        await $('scanVideo').play();
        $('scanMessage').textContent = '将桌面端二维码放入框内';
        void scanLoop(detector);
      } catch (error) {
        stopScanner();
        const denied = error?.name === 'NotAllowedError';
        msg('bindMessage', denied ? '摄像头权限被拒绝，请允许访问后重试，或用绑定码连接' : (error?.message || '摄像头启动失败，请用绑定码连接'), true);
      }
    }

    $('bindCode').addEventListener('input', (e) => { e.target.value = e.target.value.replace(/[^0-9a-z]/gi, '').toUpperCase().slice(0, 6); });
    $('bindButton').addEventListener('click', () => void doBind());
    $('scanButton').addEventListener('click', () => void startScanner());
    $('scanCloseButton').addEventListener('click', stopScanner);
    $('scanImageButton').addEventListener('click', () => { $('scanImageInput').click(); });
    $('scanImageInput').addEventListener('change', (e) => { const f = e.target.files && e.target.files[0]; if (f) void recognizeImageFromFile(f); e.target.value = ''; });
    $('scanOverlay').addEventListener('click', (e) => { if (e.target === $('scanOverlay')) stopScanner(); });
    document.addEventListener('visibilitychange', () => { if (document.hidden && scanStream) stopScanner(); });
    $('unbindButton').addEventListener('click', () => { if (confirm('确定更换绑定吗？')) clearBinding(); });
    $('backBtn').addEventListener('click', () => { location.href='/mobile/'; });

    (function init() {
      const params = new URLSearchParams(location.search);
      const directBind = params.get('bind');
      // 若是扫码直链且当前无绑定，自动绑定
      if (directBind && !(mobileAuth?.bindId)) {
        $('bindCode').value = '';
        callApi({ action: 'mobile.bind', bindId: directBind, deviceName: '我的手机' }).then((d) => {
          if (d.success) { mobileAuth = { bindId: d.bindId, mobileToken: d.mobileToken, deviceName: d.deviceName, code: d.code }; localStorage.setItem(storageKey, JSON.stringify(mobileAuth)); history.replaceState(null, '', location.pathname); }
          else $('bindCode').placeholder = '绑定码无效';
          render();
        }).catch(() => render());
      } else render();
    })();
  </script>
</body>
</html>
