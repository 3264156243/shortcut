<!doctype html>
<html lang="zh-CN">
<head>
  <!-- anti-cache: mobile page updates must take effect immediately -->
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#26231f" />
  <title>ShortCut 手机任务墙</title>
  <style>
    :root { color-scheme: dark; font-family: "Microsoft YaHei", "PingFang SC", sans-serif; background: #26231f; color: #f6efe5; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; min-height: 100dvh; background: linear-gradient(rgba(255,255,255,.022) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.018) 1px, transparent 1px), #26231f; background-size: 24px 24px; }
    button, input, textarea, select { font: inherit; } button { cursor: pointer; }
    .shell { width: min(100%, 580px); margin: 0 auto; padding: 18px 14px 38px; }
    .topbar { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }
    .back { width: 38px; height: 38px; border: 0; border-radius: 9px; color: #eee4da; background: #33302c; font-size: 18px; flex: 0 0 auto; }
    .brand { min-width: 0; }
    .brand h1 { margin: 0; font-size: 18px; }
    .brand p { margin: 3px 0 0; color: #aaa198; font-size: 11px; }
    .status { margin-left: auto; display: inline-flex; align-items: center; gap: 7px; color: #c8beb3; font-size: 11px; }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #8f877e; }
    .status.connected .status-dot { background: #63b582; box-shadow: 0 0 0 4px rgba(99,181,130,.12); }
    .paper { position: relative; color: #4f4438; background: repeating-linear-gradient(to bottom, transparent 0, transparent 33px, rgba(126,99,63,.13) 34px), #f3e8c9; border: 1px solid rgba(92,68,38,.16); box-shadow: 0 12px 26px rgba(0,0,0,.22); padding: 34px clamp(16px,4vw,30px) 26px; border-radius: 8px; }
    .paper::before, .paper::after { content: ""; position: absolute; top: -15px; width: 70px; height: 26px; background: rgba(193,91,64,.76); box-shadow: inset 0 0 0 1px rgba(255,255,255,.15); }
    .paper::before { left: 10%; transform: rotate(-5deg); } .paper::after { right: 10%; transform: rotate(4deg); background: rgba(222,155,57,.72); }
    .paper h2 { margin: 0 0 5px; font-size: 20px; }
    .paper .hint { margin: 0 0 20px; font-size: 12px; color: #817363; }
    .bind-summary { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; padding: 9px 11px; border: 1px solid rgba(90,68,43,.16); border-radius: 7px; background: rgba(255,255,255,.28); color: #6a5847; font-size: 11px; }
    .bind-code { font: 700 13px Consolas,monospace; letter-spacing: 1px; color: #9f493a; }
    .text-button { margin-left: auto; border: 0; padding: 2px 0; background: transparent; color: #8b593d; font-size: 11px; }
    label { display: block; margin-bottom: 7px; font-size: 12px; font-weight: 700; color: #685a4b; }
    input, textarea, select { width: 100%; border: 1px solid rgba(90,68,43,.25); border-radius: 7px; outline: none; color: #41372d; background: rgba(255,252,242,.65); }
    input, select { height: 42px; padding: 0 12px; }
    select { appearance: none; padding-right: 32px; background-image: linear-gradient(45deg, transparent 50%, #765f49 50%), linear-gradient(135deg, #765f49 50%, transparent 50%); background-position: calc(100% - 15px) 16px, calc(100% - 10px) 16px; background-size: 5px 5px,5px 5px; background-repeat: no-repeat; }
    textarea { min-height: 96px; padding: 11px 12px; resize: vertical; line-height: 1.6; }
    .field { margin-bottom: 15px; }
    .type-switches { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 4px 0 14px; }
    .type-switch { min-height: 46px; display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 0 12px; border: 1px solid rgba(90,68,43,.2); border-radius: 7px; color: #665848; background: rgba(255,255,255,.3); font-weight: 700; font-size: 13px; }
    .type-switch::after { content: ""; width: 32px; height: 18px; flex: 0 0 auto; border-radius: 9px; background: rgba(91,75,58,.24); transition: background .16s; }
    .type-switch.active { color: #8c3e32; border-color: rgba(159,73,58,.42); background: rgba(159,73,58,.09); }
    .type-switch.active::after { background: #9f493a; box-shadow: inset 14px 0 0 #f8eee2; }
    .optional-field { transition: opacity .16s; }
    .hidden { display: none !important; }
    #submitButton { width: 100%; min-height: 52px; border: 0; border-radius: 8px; color: #fff; background: #9f493a; font-size: 16px; font-weight: 700; box-shadow: 0 5px 14px rgba(99,44,33,.22); }
    .message { min-height: 18px; margin-top: 12px; text-align: center; font-size: 12px; color: #7e6f5e; }
.board-hint { margin: 7px 0 0; font-size: 11px; line-height: 1.5; color: #a23932; }
    /* 桌面端在线状态：在线=绿、离线=红、未知/检测中=灰 */
    .desktop-state { font-size: 11px; color: #8a7c6b; }
    .desktop-state.online { color: #337552; }
    .desktop-state.offline { color: #a23932; }
    .message.error { color: #a23932; } .message.success { color: #337552; }
    @media (max-width: 420px) { .type-switches { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <button id="backBtn" class="back" type="button">‹</button>
      <div class="brand"><h1>任务墙</h1><p>把任务从手机钉到桌面</p></div>
      <div id="status" class="status"><i class="status-dot"></i><span id="statusText">连接中…</span></div>
    </header>

    <section class="paper">
      <h2>新增任务</h2>
      <p class="hint">任务内容仅临时存储在 ShortCut 服务器，桌面端启动会自动接收，也可在任务墙板块点「同步云端」并从云端删除。</p>
      <div class="bind-summary">
        <span>当前桌面</span><strong id="currentBindCode" class="bind-code">--</strong>
        <span id="desktopState" class="desktop-state">桌面端状态未知</span>
        <button id="refreshBoardsButton" class="text-button" type="button">刷新任务墙</button>
      </div>
      <form id="taskForm">
        <div class="field">
          <label for="title">任务标题</label>
          <input id="title" maxlength="120" required placeholder="要完成什么？" />
        </div>
        <div class="type-switches" aria-label="任务类型">
          <button id="longTextToggle" class="type-switch" type="button" aria-pressed="false">长文本</button>
          <button id="reminderToggle" class="type-switch" type="button" aria-pressed="false">待办提醒</button>
        </div>
        <div id="detailsField" class="field optional-field hidden">
          <label for="details">详细内容（可选）</label>
          <textarea id="details" maxlength="2000" placeholder="补充说明、清单或备注"></textarea>
        </div>
        <div id="reminderField" class="field optional-field hidden">
          <label for="reminderAt">提醒时间</label>
          <input id="reminderAt" type="datetime-local" />
        </div>
        <div class="field">
          <label for="boardName">目标任务墙</label>
          <select id="boardName"><option value="">正在读取桌面任务墙…</option></select>
          <p id="boardHint" class="board-hint" hidden></p>
        </div>
        <button id="submitButton" type="submit">钉到桌面任务墙</button>
        <div id="taskMessage" class="message"></div>
      </form>
    </section>
  </main>

  <!-- 共享 SDK：绑定读写与带身份的请求统一由它提供 -->
  <script src="/sync/sdk.php"></script>
  <script>
    const sdk=window.ShortCutMobile;
    const el=(id)=>document.getElementById(id);
    let bindId='', bindCode='', mobileAuth=sdk.binding();

    /** 任务墙接口都带移动身份，统一走 sdk.request（失败抛出，沿用本页原语义） */
    async function callApi(payload){
      const body=Object.assign({},payload||{});
      const action=body.action;
      delete body.action;
      const d=await sdk.request(action,body);
      if(!d||!d.success){ if(d&&d.needBind) goBind(); throw new Error((d&&d.message)||'服务暂时不可用') }
      return d;
    }
    function setMessage(target,text,type){target.textContent=text||'';target.className='message'+(type?' '+type:'')}
    function goBind(){location.href='/bind/?next='+encodeURIComponent(location.pathname)}

    /**
     * 读取桌面真实任务墙列表填充下拉框。
     *
     * 修复"手机端又只剩默认任务墙"的**可诊断性**问题：
     * 原来「请求失败」和「桌面确实一份墙名都没上报」两种完全不同的情况，都渲染成同一个
     * <option>默认任务墙</option>，界面上分不出来，只能靠猜。
     * 现在三种状态各自可辨认：
     *   1) 拿到非空列表          → 逐个渲染（墙名 == 桌面真实墙名）
     *   2) 请求成功但列表为空    → 默认任务墙 + 明确提示「桌面端尚未上报墙名」
     *   3) 请求失败/身份失效     → 默认任务墙 + 错误原因 + 可重试（不是静默兜底）
     * 另加 console.log 输出原始响应，便于真机排查时对照服务端日志。
     */
    function fillBoards(names,note){
      const select=el('boardName');select.innerHTML='';
      names.forEach(name=>{const o=document.createElement('option');o.value=name;o.textContent=name;select.appendChild(o)});
      const hint=el('boardHint');
      if(hint){hint.textContent=note||'';hint.hidden=!note}
    }

    /** 把服务端回的 boardsUpdatedAt（ISO8601）渲染成"刚刚 / X 分钟前 / X 小时前 / X 天前" */
    function freshText(iso){
      if(!iso) return '';
      const t=new Date(iso).getTime();
      if(!t||isNaN(t)) return '';
      const mins=Math.max(0,Math.round((Date.now()-t)/60000));
      if(mins<1) return '刚刚';
      if(mins<60) return mins+' 分钟前';
      const hours=Math.round(mins/60);
      if(hours<24) return hours+' 小时前';
      return Math.round(hours/24)+' 天前';
    }

    /**
     * 桌面端在线状态。
     *
     * 为什么不用 bind.devices 的 lastSeenAt：那个字段只在桌面端**主动调 api.php** 时才刷新
     * （60 秒节流），桌面端平时靠中继长连接维持在线，lastSeenAt 会显得很旧、误判成离线。
     * 所以这里经中继问一次 `/api/ping`：中继在 auth-ok 里明确告诉客户端 desktopOnline，
     * sdk.requestDesktop 会把它翻译成 desktopOffline。失败一律"未知"，不吓唬用户。
     */
    let desktopProbeBusy=false;
    async function refreshDesktopState(){
      const state=el('desktopState'); if(!state||desktopProbeBusy) return;
      desktopProbeBusy=true;
      state.className='desktop-state'; state.textContent='检测桌面端…';
      try{
        const r=await window.ShortCutMobile.requestDesktop('/api/ping',{},6000);
        if(r&&r.success){ state.className='desktop-state online'; state.textContent='桌面端在线'; }
        else if(r&&r.desktopOffline){ state.className='desktop-state offline'; state.textContent='桌面端离线（任务会排队）'; }
        else { state.className='desktop-state'; state.textContent='桌面端状态未知'; }
      }catch(e){ state.className='desktop-state'; state.textContent='桌面端状态未知'; }
      finally{ desktopProbeBusy=false; }
    }

    async function loadBoards(){
      const select=el('boardName'),hint=el('boardHint');select.disabled=true;
      if(hint){hint.textContent='正在读取桌面任务墙…';hint.hidden=false}
      try{
        const d=await callApi({action:'board.list',board:'taskwall',bindId});
        const boards=Array.isArray(d.boards)?d.boards.filter(name=>typeof name==='string'&&name.trim()):[];
        const fresh=freshText(d.boardsUpdatedAt);
        console.log('[taskwall] board.list 响应',d,'解析出墙名',boards,'列表同步于',fresh||'(未知)');
        if(!boards.length){
          fillBoards(['默认任务墙'],'桌面端尚未上报任务墙列表，已回退到「默认任务墙」。请在电脑上打开任务墙页面后点「刷新任务墙」重试。');
        }else{
          // 墙名列表是桌面端上次上报的快照：桌面离线久了就可能过期（改了名/删了墙这里还是旧的）
          fillBoards(boards, fresh?('列表同步于 '+fresh+(fresh==='刚刚'?'':'，桌面端开机后会自动更新')):'');
        }
      }catch(error){
        // 不静默兜底：把真实原因显示出来，用户/排查者才知道要不要重新绑定桌面端
        console.warn('[taskwall] board.list 失败',error);
        fillBoards(['默认任务墙'],(error&&error.message?error.message:'读取失败')+'（已回退到「默认任务墙」，请点上方「刷新任务墙」重试）');
      }finally{select.disabled=false}
    }

    /** 列表与在线状态一起刷新（手动按钮、回到前台、定时都走这里） */
    function refreshAll(){ void loadBoards(); void refreshDesktopState(); }

    function setConnected(){
      bindId=mobileAuth.bindId;
      bindCode=mobileAuth.code||'--';
      el('status').classList.add('connected');
      el('statusText').textContent='已连接';
      el('currentBindCode').textContent=bindCode;
      refreshAll();
      setTimeout(()=>el('title').focus(),60);
    }

    function setTypeEnabled(toggleId,fieldId,enabled){const t=el(toggleId);t.classList.toggle('active',enabled);t.setAttribute('aria-pressed',enabled?'true':'false');el(fieldId).classList.toggle('hidden',!enabled)}

    el('longTextToggle').addEventListener('click',()=>setTypeEnabled('longTextToggle','detailsField',el('longTextToggle').getAttribute('aria-pressed')!=='true'));
    el('reminderToggle').addEventListener('click',()=>setTypeEnabled('reminderToggle','reminderField',el('reminderToggle').getAttribute('aria-pressed')!=='true'));
    el('refreshBoardsButton').addEventListener('click',()=>refreshAll());
    el('backBtn').addEventListener('click',()=>{ location.href='/mobile/'; });

    // ── 列表自动刷新（需求 3）──
    // 墙名是桌面端上报的快照，桌面端改了墙名/加了墙，手机端不该只能靠手动点刷新才知道。
    // 两个时机：① 回到前台立刻刷（最常用）；② 前台时每 30 秒兜底刷一次。
    // 后台不刷：省流量也省服务端限流配额（board.list 限 120 次/分钟/IP）。
    const AUTO_REFRESH_MS=30000;
    document.addEventListener('visibilitychange',()=>{ if(!document.hidden) refreshAll(); });
    window.setInterval(()=>{ if(!document.hidden) refreshAll(); },AUTO_REFRESH_MS);

    el('taskForm').addEventListener('submit',async event=>{
      event.preventDefault();
      const title=el('title').value.trim();if(!title)return;
      el('submitButton').disabled=true;setMessage(el('taskMessage'),'正在提交…');
      try{
        const longText=el('longTextToggle').getAttribute('aria-pressed')==='true';
        const reminderEnabled=el('reminderToggle').getAttribute('aria-pressed')==='true';
        const localReminder=el('reminderAt').value;
        if(reminderEnabled&&!localReminder)throw new Error('开启待办提醒后请选择提醒时间');
        const d=await callApi({action:'push',board:'taskwall',bindId,side:'mobile',mobileToken:mobileAuth.mobileToken,text:title,longText,details:longText?el('details').value.trim():'',reminderEnabled,reminderAt:reminderEnabled&&localReminder?new Date(localReminder).toISOString():'',boardName:el('boardName').value.trim()});
        if(!d.success)throw new Error(d.message||'提交失败');
        el('title').value='';el('details').value='';el('reminderAt').value='';
        setTypeEnabled('longTextToggle','detailsField',false);setTypeEnabled('reminderToggle','reminderField',false);
        // 区分"已实时送达"和"桌面端离线、任务排队"——服务端一直回了这两个字段，以前只是没用。
        // 用户最怕的是"我钉了但它到底收没收到"，这两种情况的说法必须不一样。
        if(d.desktopOnline===true){
          setMessage(el('taskMessage'),d.deliveredRealtime===true?'已实时送达桌面端':'桌面端在线，任务已入队，稍后自动接收','success');
        }else{
          setMessage(el('taskMessage'),'桌面端离线：任务已排队，等它开机后自动接收','success');
        }
        // 状态条跟着刷新（离线时下一次检测会把状态点亮/熄灭，避免与实际不符）
        void refreshDesktopState();
        setTimeout(()=>el('title').focus(),80);
      }catch(error){setMessage(el('taskMessage'),error.message||'提交失败，请稍后再试','error')}
      finally{el('submitButton').disabled=false}
    });

    (async()=>{
      if(mobileAuth?.bindId&&mobileAuth?.mobileToken){ const d=await callApi({action:'bind.info',bindId:mobileAuth.bindId}).catch(()=>null); if(d&&d.success&&d.valid){setConnected();return;} if(d&&d.valid===false){sdk.clearBinding();mobileAuth=null;} }
      goBind();
    })();
  </script>
</body>
</html>
