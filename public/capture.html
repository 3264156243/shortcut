<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>ShortCut 区域截图</title>
  <style>
    *{box-sizing:border-box}
    html,body{width:100%;height:100%;margin:0;overflow:hidden;cursor:crosshair;user-select:none;background:#000}
    img{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
    #shade{position:absolute;inset:0;background:rgba(0,0,0,.34)}
    #selection{display:none;position:absolute;border:1px solid #fff;box-shadow:0 0 0 9999px rgba(0,0,0,.42);background:rgba(255,255,255,.04)}
    #size{position:absolute;left:0;top:-30px;padding:5px 8px;border-radius:5px;background:#111;color:#fff;font:12px "Segoe UI",sans-serif;white-space:nowrap}
    #hint{position:absolute;left:50%;top:18px;transform:translateX(-50%);padding:7px 12px;border-radius:6px;background:rgba(15,15,18,.86);color:#fff;font:13px "Microsoft YaHei UI",sans-serif}
  </style>
</head>
<body>
  <img id="shot" alt="" />
  <div id="shade"></div>
  <div id="selection"><span id="size"></span></div>
  <div id="hint">拖动选择截图区域，Esc 或右键取消</div>
  <script>
    (function () {
      var box = document.getElementById('selection');
      var size = document.getElementById('size');
      var shade = document.getElementById('shade');
      var img = document.getElementById('shot');
      var start = null;
      var api = window.electronAPI;

      // 加载截屏源图（Rust 端 PowerShell CopyFromScreen 产物，base64 data URL）
      void api.getScreenshotData().then(function (r) {
        if (r && r.success && r.dataUrl) { img.src = r.dataUrl; }
        else { document.getElementById('hint').textContent = '截图源加载失败，Esc 退出'; }
      });

      function draw(x, y) {
        var left = Math.min(start.x, x), top = Math.min(start.y, y);
        var width = Math.abs(x - start.x), height = Math.abs(y - start.y);
        box.style.cssText = 'display:block;left:' + left + 'px;top:' + top + 'px;width:' + width + 'px;height:' + height + 'px';
        size.textContent = Math.round(width) + ' × ' + Math.round(height);
      }
      addEventListener('mousedown', function (e) {
        if (e.button !== 0) return;
        start = { x: e.clientX, y: e.clientY };
        shade.style.display = 'none';
        draw(e.clientX, e.clientY);
      });
      addEventListener('mousemove', function (e) { if (start) draw(e.clientX, e.clientY); });
      addEventListener('mouseup', function (e) {
        if (!start || e.button !== 0) return;
        var x = Math.min(start.x, e.clientX), y = Math.min(start.y, e.clientY);
        var w = Math.abs(e.clientX - start.x), h = Math.abs(e.clientY - start.y);
        start = null;
        if (w < 3 || h < 3) { shade.style.display = 'block'; box.style.display = 'none'; return; }
        box.style.display = 'none';
        document.getElementById('hint').textContent = '处理中…';
        // 逻辑像素坐标交给 Rust（物理裁剪含 DPI 换算）
        void api.captureRegion(x, y, w, h).then(function (r) {
          if (!(r && r.success)) {
            document.getElementById('hint').textContent = (r && r.error) ? r.error : '裁剪失败，Esc 退出';
            shade.style.display = 'block';
            return;
          }
          api.closeWindow();
        });
      });
      addEventListener('keydown', function (e) { if (e.key === 'Escape') api.closeWindow(); });
      addEventListener('contextmenu', function (e) { e.preventDefault(); api.closeWindow(); });
    })();
  </script>
</body>
</html>
