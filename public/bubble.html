<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
*{box-sizing:border-box}html,body{height:100%}body{margin:0;padding:8px;background:transparent;font-family:"Special Elite","Noto Serif SC","Microsoft YaHei UI",serif;color:#2c2416;overflow:hidden}
.bubble{position:relative;display:flex;max-height:100%;flex-direction:column;overflow:hidden;background:#f5f0e8;border:1px solid rgba(80,60,35,.18);border-radius:8px;box-shadow:4px 8px 28px rgba(0,0,0,.48);-webkit-app-region:drag}
.tape{position:absolute;left:50%;top:-3px;width:72px;height:17px;transform:translateX(-50%) rotate(-1deg);background:rgba(201,166,107,.72);border:1px solid rgba(90,65,35,.1)}
.source{padding:22px 16px 10px;font-size:12px;line-height:1.6;color:#81735f;white-space:pre-wrap;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.divider{height:1px;flex:none;background:#d8ccba;margin:0 16px}
.result-head{display:flex;align-items:center;justify-content:space-between;padding:8px 12px 0 16px;color:#746550;font-size:11px;font-weight:700}
.actions{display:flex;gap:6px}
.actions button{border:1px solid #cbbda8;border-radius:7px;background:#fffaf0;color:#655845;cursor:pointer;font-size:12px;padding:2px 8px;-webkit-app-region:no-drag}
.actions button:hover{background:#e7dfd2}
.actions button.pinned{background:#9b2335;border-color:#9b2335;color:#fff8ed}
.result{min-height:0;overflow-y:auto;padding:5px 16px 16px;font-size:15px;line-height:1.75;white-space:pre-wrap;overflow-wrap:anywhere;background-image:repeating-linear-gradient(transparent,transparent 25px,rgba(108,88,61,.09) 25px,rgba(108,88,61,.09) 26px)}
.result::-webkit-scrollbar{width:5px}.result::-webkit-scrollbar-thumb{background:#b9aa95;border-radius:3px}
.error{padding:20px 16px;font-size:14px;line-height:1.7;color:#9b2335}
#toast{position:absolute;left:50%;bottom:12px;transform:translate(-50%,8px);padding:6px 12px;border-radius:7px;background:#2c2416;color:#fff8ed;font-size:12px;opacity:0;pointer-events:none;transition:.18s}
#toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<div class="bubble"><div class="tape"></div><div id="app"></div><div id="toast">已复制译文</div></div>
<script>
(function(){
  var q = {};
  location.search.replace(/^\?/,'').split('&').forEach(function(kv){
    var i = kv.indexOf('=');
    if (i > 0) q[decodeURIComponent(kv.slice(0,i))] = decodeURIComponent(kv.slice(i+1).replace(/\+/g,' '));
  });
  var app = document.getElementById('app');
  function esc(s){ var d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
  function closeSelf(){
    try { window.electronAPI && window.electronAPI.closeWindow && window.electronAPI.closeWindow(); } catch(_){}
  }
  // 5 秒无交互自动关闭；固定（pin）后常显
  var pinned = false, closeTimer = null;
  function armIdle(){
    if (closeTimer) clearTimeout(closeTimer);
    closeTimer = setTimeout(function(){ if (!pinned) closeSelf(); }, 5000);
  }
  ['mousemove','mousedown','wheel','keydown','touchstart'].forEach(function(ev){
    document.addEventListener(ev, function(){ armIdle(); }, { passive: true });
  });
  armIdle();
  if (q.e) {
    app.innerHTML = '<div class="error">' + esc(q.e) + '</div>';
  } else {
    app.innerHTML = '<div class="source">' + esc(q.s || '') + '</div>'
      + '<div class="divider"></div>'
      + '<div class="result-head"><span>译文</span><span class="actions">'
      + '<button id="pin" title="固定纸条">📌 固定</button>'
      + '<button id="copy" title="复制译文">⧉ 复制</button>'
      + '</span></div>'
      + '<div class="result">' + esc(q.r || '') + '</div>';
    var pin = document.getElementById('pin');
    var copy = document.getElementById('copy');
    var toast = document.getElementById('toast');
    pin.addEventListener('click', function(){
      pinned = !pinned;
      pin.classList.toggle('pinned', pinned);
      pin.textContent = pinned ? '📌 已固定' : '📌 固定';
      if (!pinned) armIdle();
    });
    copy.addEventListener('click', function(){
      var text = q.r || '';
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text);
      } else {
        var ta = document.createElement('textarea'); ta.value = text;
        document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove();
      }
      toast.classList.add('show');
      setTimeout(function(){ toast.classList.remove('show'); }, 1400);
    });
  }
})();
</script>
</body>
</html>
